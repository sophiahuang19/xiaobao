<style>

ize:12px;padding:10px 16px;border-radius:24px;background:oklch(98% .01 80 / .94);transition:opacity .2s}.moods{display:flex;justify-content:center;gap:7px;margin-top:20px}.moods button{min-height:44px;padding:0 15px;border-radius:24px;color:var(--muted)}.moods button span{margin-right:5px;font-size:17px}.moods button:hover{background:oklch(93% .02 90)}.moods button[aria-pressed=true]{background:oklch(89% .025 145);color:oklch(34% .04 150)}.photo-note{text-align:center;color:var(--muted);font-size:10px;margin:12px 0 0;letter-spacing:.04em}.eyebrow{font-size:10px;letter-spacing:.15em;color:var(--muted);font-weight:550;margin:0 0 20px}h1{font-size:38px;font-weight:550;line-height:1.5;letter-spacing:.035em;margin:0 0 20px}.intro{font-size:14px;line-height:2;color:var(--muted);margin:0}.cat-message{font-size:16px;margin:28px 0 34px;color:var(--blue);min-height:24px}.together{font-size:11px;color:var(--muted);margin:24px 0 0}footer{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding:24px 0 30px;font-size:10px;color:var(--muted);letter-spacing:.08em}.heart{position:absolute;z-index:4;pointer-events:none;color:oklch(98% .01 80);font-size:25px;text-shadow:0 2px 8px var(--pink);animation:float 1s ease-out forwards}@keyframes float{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(-50%,-100px) scale(1.2) rotate(var(--r))}}.bubble{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:3;background:oklch(98% .01 80);color:var(--ink);font-size:13px;padding:10px 18px;border-radius:18px;white-space:nowrap;animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
/* 签筒 */

.tube-box{width:calc(150px * var(--s));height:calc(300px * var(--s))}
.tube{position:relative;width:150px;height:300px;transform:scale(var(--s));transform-origin:0 0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.tube:focus-visible{outline:3px solid var(--blue);outline-offset:8px;border-radius:24px}
.tube .rock{position:absolute;inset:0;transform-origin:50% 90%}
.tube.shake .rock{animation:shake .14s linear infinite alternate}
@keyframes shake{from{transform:rotate(-9deg) translateX(-4px)}to{transform:rotate(9deg) translateX(4px)}}

.sticks i::before{content:"";position:absolute;top:0;left:0;right:0;height:18px;border-radius:5px 5px 0 0;background:#E3919F}
.tube.shake .sticks i{animation:jig .1s linear infinite alternate}
.tube.shake .sticks i:nth-child(odd){animation-duration:.13s}
.tube.shake .sticks i:nth-child(3n){animation-duration:.08s}
@keyframes jig{to{transform:rotate(var(--r)) translateY(-10px)}}

.tube-body::before,.tube-body::after{content:"";position:absolute;left:0;right:0;height:8px;background:rgba(0,0,0,.18)}
.tube-body::before{top:34px}.tube-body::after{bottom:34px}

.drawn::before{content:"";position:absolute;top:0;left:0;right:0;height:26px;border-radius:8px 8px 0 0;background:#E3919F}
@keyframes popout{from{transform:translateY(110px)}to{transform:translateY(-130px) rotate(4deg)}}
.drawn.fly{animation:flyaway .45s ease-in forwards}
@keyframes flyaway{from{transform:translateY(-130px) rotate(4deg)}to{transform:translateY(-110vh) rotate(-20deg);opacity:0}}
.drawn:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.hint{margin:12px 0 0;font-size:10px;color:var(--muted);line-height:1.6;min-height:16px}.hint b{color:var(--blue);font-weight:550}
.result{border:1px solid var(--line);color:var(--ink);background:var(--ground);border-radius:24px;padding:30px 24px 24px;width:min(440px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 30px 100px oklch(20% .02 55 / .25)}.result[open]{display:flex;flex-direction:column;align-items:center;gap:16px;animation:rise .24s cubic-bezier(.16,1,.3,1)}.result::backdrop{background:oklch(22% .025 55 / .45)}.result .eyebrow{margin:4px 24px 0;letter-spacing:.08em}.close{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;font-size:24px;color:var(--muted)}.close:hover{background:oklch(90% .02 80)}.cardimg{display:block;width:auto;max-width:100%;max-height:60dvh;border-radius:16px}.save-hint{font-size:11px;color:var(--muted);margin:0}.result-actions{display:flex;gap:12px;justify-content:center}.again{min-height:46px;padding:0 20px;border:1px solid var(--line);border-radius:25px;font-size:12px}@keyframes rise{from{opacity:0;transform:translateY(16px)}}

  .photo-tag{top:16px;font-size:12px}.pethint{bottom:14px;font-size:12px}.moods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:12px}.moods button{min-height:48px;padding:0 4px;font-size:14px}.moods button span{margin-right:4px}.photo-note{font-size:11px;margin:8px 0 0}

}
@media(max-width:360px){.app{padding-inline:16px}h1{font-size:22px}.brand-en{display:none}.moods button{font-size:13px}.photo{border-radius:64px 64px 20px 20px}#draw-button{width:calc(100% - 32px)}footer{font-size:9px}}

<body>
<main class="app" id="app">
  <header class="topbar"><a class="brand" href="./" aria-label="小宝首页"><span class="brand-paw">✿</span> 小宝 <span class="brand-en">XIAOBAO</span></a><button id="sound" class="sound" aria-pressed="false" aria-label="开启音效">音效 · 关</button></header>
  <div class="companion">
    <section class="portrait-section" aria-label="陪小宝待一会儿">
      <button class="photo" id="photo" aria-label="摸摸小宝">
        <img id="cat-image" src="assets/happy.jpg" alt="小宝伸出毛茸茸的爪子，想和你贴贴" fetchpriority="high">
        <span class="photo-tag"><i></i><span id="mood-tag">想和你贴贴</span></span>
        <span class="pethint" id="pethint">轻轻点一下，摸摸小宝 ♡</span>
      </button>
      <div class="moods" role="group" aria-label="小宝的心情">
        <button data-mood="happy" aria-pressed="true"><span>♡</span> 贴贴</button>
        <button data-mood="curious" aria-pressed="false"><span>✧</span> 好奇</button>
        <button data-mood="sleepy" aria-pressed="false"><span>☾</span> 困困</button>
        <button data-mood="original" aria-pressed="false"><span>◉</span> 本尊</button>
      </div>
      <p class="photo-note" id="photo-note">小宝的想象日常 · AI 生成</p>
    </section>
    <section class="welcome">
      <p class="eyebrow">A LITTLE PAUSE, WITH XIAOBAO</p>
      <h1>来啦，<br>陪小宝待一会儿。</h1>
      <p class="intro">外面的世界先等等。<br>这里有一只软软的小猫，和一点小小的好运。</p>
      <p class="cat-message" id="cat-message" aria-live="polite">“今天也想被你摸摸。”</p>
      <section class="draw" aria-labelledby="fortune-title">
        <div class="fortune-copy"><span class="eyebrow">A NOTE FOR YOU</span><h2 id="fortune-title">抽一支小宝签</h2><p>让小宝送你一句悄悄话。</p><button id="draw-button" class="primary">摇一摇，接住小好运 <span aria-hidden="true">↗</span></button><p class="hint" id="hint" aria-live="polite">也可以按住右边的签筒</p></div>
    <div class="tube-box">
      <div class="tube" id="tube" role="button" tabindex="0" aria-label="按住签筒摇一摇，抽一支小宝签">
        <div class="rock">
          <div class="sticks" id="sticks"></div>
          <div class="tube-body"><span class="tube-label">小宝签<svg viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="5" ry="4.2"/><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6.5" r="2.2"/><circle cx="14" cy="6.5" r="2.2"/><circle cx="18" cy="10" r="2.2"/></svg></span></div>
        </div>
      </div>
    </div>
      </section>
      <p class="together" id="together">不用赶时间，小宝一直在。</p>
    </section>
  </div>
  <footer><span>一只小猫，一点治愈。</span><span>MADE WITH ♡ FOR 小宝</span></footer>
</main>
<dialog class="result" id="result" aria-label="小宝送你的签">
  <button class="close" id="close" aria-label="关闭签卡">×</button>
  <p class="eyebrow">小宝的悄悄话，送给你</p>
  <img class="cardimg" id="cardimg" alt="">
  <p class="save-hint">长按图片保存，把小好运带走。</p>
  <div class="result-actions"><a id="download" class="primary" download="小宝签.jpg">保存签卡 ↓</a><button class="again" id="again">再抽一支</button></div>
</dialog>
<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const LINES=[
"今天的计划：晒太阳，睡觉，被你摸。做完三件就是完美的一天。",
"你出门的时候我没有在等你，我只是刚好睡在门口。",
"我对你慢慢眨眼了，这在猫语里是“我信任你”。你也眨一下。",
"我的蓝眼睛里没有蓝色色素。你看到的蓝，是光的魔法。",
"我这么沉不是胖，布偶要长到四岁才算长大。大概吧。",
"被抱起来的时候我会软成一摊，这是我们布偶的招牌动作。",
"我一天要睡十四个小时，剩下的时间用来想你。和想吃的。",
"你打字的时候，键盘是全家最暖和的地方。",
"我竖着尾巴走向你，意思是：你好呀，今天也很高兴见到你。",
"我用脸蹭你，是在给你盖章：这个人类是小宝的。",
"我踩你的时候，说明我很安心。请不要动，也不要喊疼。",
"给我一个纸箱，我可以开心一整天。",
"我喵喵叫只说给你听，猫和猫之间才不这么说话。",
"我知道“小宝”是在叫我。要不要回头，看心情。",
"我胸前这圈白毛是全身最软的地方，今天允许你摸三下。",
"我不爱爬高，我更喜欢待在你脚边。",
"我背对着你睡觉，是把看不到的方向交给你了。",
"窗外有只鸟。我今天的工作很忙。",
"我把杯子推下桌子，是想确认一下重力今天还在不在。",
"我不是不理你，我只是在用耳朵听你。",
"今天也要像我一样：困了就睡，饿了就吃，想要就去蹭。",
"你回家的脚步声，我隔着门就能听出来。",
"天冷了，我的耳朵会变得更深一点。这是冬季限定款。",
"我的鼻纹全世界独一份，就像你在我心里一样。",
"呼噜呼噜是我的发动机。你一摸，它就启动。",
"我的肚子是一个陷阱，你摸之前要想清楚。",
"请多陪我玩十分钟逗猫棒，这样我就不会半夜开运动会。",
"我喝水很讲究：要流动的，要新鲜的，最好是你杯子里的。",
"我舔你有点刺，那是我舌头上的小梳子，不是嫌弃你。",
"我走路踮着脚尖，所以你永远听不到我过来。",
"你忙的时候，我就在旁边睡觉陪你。",
"我吃不出甜味，所以你的蛋糕我只是闻闻。真的只是闻闻。",
"我的胡子有多宽，我就能钻多宽的缝。今天钻进了你的被子。",
"如果我盯着空气看，别怕，我只是听见了你听不见的声音。",
"我睡着的时候爪子在动，是在梦里追东西。",
"梳毛时间到了。我的围兜需要专业护理。",
"我今天的心情：软软的，蓬蓬的，想被抱一下。",
"你看手机的时间，可以分一点给我吗？",
"我脚底是粉色的肉垫，今天允许你捏一下。",
"我小时候是一团白毛球，颜色是慢慢长出来的。你也慢慢来。",
"下雨天最适合的事：趴在窗边，听雨，打呼噜。",
"我不是黏人，我只是刚好想和你待在同一个房间。",
"请记得给我换水。这是我今天唯一的要求。之一。",
"我的尾巴甩得很快的时候，意思是“够了”，不是“好开心”。",
"早上五点叫你起床，是因为我是晨昏动物，不是故意的。",
"我把玩具叼给你，是请你一起玩的邀请函。",
"今天好好吃饭了吗？我吃了，吃了三顿。",

const CN="零一二三四五六七八九";
const cnNum=n=>n<=10?(n===10?"十":CN[n]):n<20?"十"+CN[n%10]:CN[Math.floor(n/10)]+"十"+(n%10?CN[n%10]:"");
const dateKey=(d=new Date())=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
function wrapZh(ctx,text,maxW){
  const noStart="，。！？、：；）」』”…",lines=[];let line="";
  for(const ch of text){
    if(ctx.measureText(line+ch).width>maxW&&line&&!noStart.includes(ch)){lines.push(line);line=ch}else line+=ch;
  }
  if(line)lines.push(line);return lines;
}
function drawCard(idx){
  const W=1080,H=1440,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const FONT='"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif';
  x.fillStyle="#FBF8F5";x.fillRect(0,0,W,H);
  const px=110,py=110,pw=W-220,ph=740,R=pw/2,br=44,img=document.querySelector("#photo img");
  x.save();x.beginPath();x.moveTo(px,py+R);x.arc(px+R,py+R,R,Math.PI,0);x.lineTo(px+pw,py+ph-br);
  x.quadraticCurveTo(px+pw,py+ph,px+pw-br,py+ph);x.lineTo(px+br,py+ph);x.quadraticCurveTo(px,py+ph,px,py+ph-br);x.closePath();x.clip();
  const s=Math.max(pw/img.naturalWidth,ph/img.naturalHeight),iw=img.naturalWidth*s,ih=img.naturalHeight*s;
  x.drawImage(img,px+(pw-iw)/2,py+(ph-ih)*0.28,iw,ih);x.restore();
  // stick-number badge on the photo
  const label=`第${cnNum(idx+1)}签`;x.font=`600 34px ${FONT}`;const tw=x.measureText(label).width+56;
  x.fillStyle="#E3919F";x.beginPath();x.roundRect?x.roundRect(W/2-tw/2,py+ph-34,tw,68,34):x.rect(W/2-tw/2,py+ph-34,tw,68);x.fill();
  x.fillStyle="#fff";x.textAlign="center";x.fillText(label,W/2,py+ph+12);
  const d=new Date();x.fillStyle="#9A8F88";x.font=`500 32px ${FONT}`;
  x.fillText(`${d.getMonth()+1}月${d.getDate()}日 · 星期${"日一二三四五六"[d.getDay()]}`,W/2,py+ph+96);
  x.fillStyle="#2E221C";x.font=`600 58px ${FONT}`;
  const lines=wrapZh(x,LINES[idx],W-260),lh=88,top=py+ph+136+(3-lines.length)*lh/2;
  lines.forEach((l,i)=>x.fillText(l,W/2,top+lh*(i+0.75)));
  x.font=`500 38px ${FONT}`;x.fillStyle="#6E625B";x.fillText("—— 小宝",W/2-26,H-150);
  const cx=W/2+110,cy=H-164;x.fillStyle="#E3919F";
  x.beginPath();x.ellipse(cx,cy+8,16,13,0,0,7);x.fill();
  [[-17,-8],[-7,-20],[7,-20],[17,-8]].forEach(([a,b])=>{x.beginPath();x.arc(cx+a,cy+b,6.5,0,7);x.fill()});
  x.font=`400 26px ${FONT}`;x.fillStyle="#B4AAA3";x.fillText("sophiahuang19.github.io/xiaobao",W/2,H-70);
  return c.toDataURL("image/jpeg",.9);
}
/* wooden clack sound */
let ac=null,soundOn=false;
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").setAttribute("aria-pressed",String(soundOn));$("sound").setAttribute("aria-label",soundOn?"关闭音效":"开启音效");$("sound").textContent=`音效 · ${soundOn?"开":"关"}`;if(soundOn)clack()};
function clack(){
  if(!soundOn)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime,len=.05,buf=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);
    const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    f.type="bandpass";f.frequency.value=1400+Math.random()*1400;f.Q.value=4;g.gain.value=.5;
    src.buffer=buf;src.connect(f).connect(g).connect(ac.destination);src.start(t);
  }catch(e){}
}

const petLines=["呼噜呼噜～","（眯起眼睛）","再摸一下嘛","（翻了个身）","（慢慢眨眼）","（开始踩奶）","喵～","（用头顶你的手）"];

  const r=$("photo").getBoundingClientRect();
  const px=e.detail?e.clientX:r.left+r.width/2,py=e.detail?e.clientY:r.top+r.height/2;
  for(let k=0;k<3;k++){const h=document.createElement("span");h.className="heart";h.textContent="♥";
    h.style.left=(px-r.left+(k-1)*18)+"px";h.style.top=(py-r.top)+"px";h.style.setProperty("--r",(k-1)*18+"deg");
    h.style.animationDelay=k*70+"ms";$("photo").appendChild(h);setTimeout(()=>h.remove(),1400)}
  $("photo").classList.add("pat");setTimeout(()=>$("photo").classList.remove("pat"),180);

/* 签筒 */
[[4,118,-7],[16,132,-3],[28,112,2],[40,138,-1],[52,120,5],[64,130,1],[76,114,7],[88,126,3],[34,100,-5],[70,104,6]]
  .forEach(([xp,h,r])=>{const i=document.createElement("i");i.style.cssText=`--x:${xp}%;--h:${h}px;--r:${r}deg`;$("sticks").appendChild(i)});

const NEED=900;let shaken=0,holding=false,done=false,last=0,raf=0,picked=0;
function tick(now){
  const dt=Math.min(now-last,50);last=now;
  if(holding&&!done){
    shaken+=dt;if(Math.random()<.35)clack();
    $("hint").textContent=shaken<NEED/2?"摇呀摇……":"快出来了！";
    if(shaken>=NEED){dropStick();return}
    raf=requestAnimationFrame(tick);
  }
}
function startShake(){if(done||holding)return;holding=true;$("tube").classList.add("shake");last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function stopShake(){holding=false;cancelAnimationFrame(raf);$("tube").classList.remove("shake");if(!done){$("draw-button").disabled=false;$("draw-button").textContent="摇一摇，接住小好运 ↗";$("hint").textContent="也可以按住右边的签筒"}}
$("tube").addEventListener("pointerdown",e=>{if(done)return;e.preventDefault();startShake()});
["pointerup","pointercancel","pointerleave"].forEach(ev=>$("tube").addEventListener(ev,stopShake));
$("tube").addEventListener("contextmenu",e=>e.preventDefault());
$("tube").addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!e.repeat){e.preventDefault();startShake()}});
$("tube").addEventListener("keyup",stopShake);

function pick(){
  const drawn=new Set(store.get("xb-drawn",[]));
  let pool=LINES.map((_,i)=>i).filter(i=>!drawn.has(i));
  if(!pool.length){drawn.clear();pool=LINES.map((_,i)=>i)}
  const i=pool[Math.floor(Math.random()*pool.length)];drawn.add(i);store.set("xb-drawn",[...drawn]);return i;
}
function dropStick(){
  done=true;stopShake();$("draw-button").disabled=false;$("draw-button").textContent="打开小宝的悄悄话 ↗";clack();setTimeout(clack,90);
  picked=pick();
  const s=document.createElement("button");s.className="drawn";s.id="drawn";s.textContent=`第${cnNum(picked+1)}签`;
  s.setAttribute("aria-label",`第${picked+1}签，点一下看看`);
  s.addEventListener("pointerdown",e=>e.stopPropagation());
  s.onclick=()=>{s.classList.add("fly");setTimeout(showResult,380)};
  $("tube").appendChild(s);
  $("hint").innerHTML="掉出来一支！<b>点这支签</b>";
  setTimeout(()=>{if(s.isConnected&&!$("result").open)s.focus({preventScroll:true})},600);
}
let resultBusy=false;
async function showResult(){
  if(resultBusy)return;resultBusy=true;
  try{
    const img=$("cat-image");await img.decode();
    const data=drawCard(picked);$("cardimg").src=data;$("download").href=data;
    $("cardimg").alt=`第${picked+1}签：${LINES[picked]}`;
    if(!$("result").open)$("result").showModal();
  }catch(error){$("hint").textContent="图片还没准备好，再点一次试试。"}
  finally{resultBusy=false}
}
function reset(){stopShake();done=false;shaken=0;$("drawn")?.remove();$("hint").textContent="也可以按住右边的签筒";$("draw-button").disabled=false;$("draw-button").textContent="摇一摇，接住小好运 ↗"}
$("draw-button").onclick=()=>{if(done){showResult();return}startShake();$("draw-button").disabled=true;$("draw-button").textContent="小宝正在挑选……"};
let drawAgain=false;
$("again").onclick=()=>{drawAgain=true;$("result").close()};
$("close").onclick=()=>$("result").close();
$("result").addEventListener("close",()=>{reset();$("draw-button").focus();if(drawAgain){drawAgain=false;$("draw-button").click()}});
window.addEventListener("blur",stopShake);
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopShake()});
const moods={
  happy:{src:"assets/happy.jpg",tag:"想和你贴贴",message:"“今天也想被你摸摸。”",alt:"小宝伸出毛茸茸的爪子，想和你贴贴"},
  curious:{src:"assets/curious.jpg",tag:"发现一点新鲜事",message:"“那是什么？让我看看。”",alt:"小宝歪着脑袋，蓝眼睛好奇地望着羽毛"},
  sleepy:{src:"assets/sleepy.jpg",tag:"进入省电模式",message:"“你忙你的，我睡在你旁边。”",alt:"小宝蜷在柔软的沙发上，闭眼睡觉"},
  original:{src:"xiaobao.jpg",tag:"是小宝本宝",message:"“没错，就是这么漂亮。”",alt:"小宝本尊：海豹色双色布偶猫，蓝眼睛，粉鼻子"}
};
let currentMood="happy",moodRequest=0;
async function setMood(key){
  const request=++moodRequest,m=moods[key],img=$("cat-image");
  try{const next=new Image();next.src=m.src;await next.decode();if(request!==moodRequest)return;
    img.classList.add("changing");await new Promise(r=>setTimeout(r,140));if(request!==moodRequest)return;
    img.src=m.src;img.alt=m.alt;currentMood=key;
    $("mood-tag").textContent=m.tag;$("cat-message").textContent=m.message;
    $("photo-note").textContent=key==="original"?"小宝的真实照片":"小宝的想象日常 · AI 生成";
    document.querySelectorAll("[data-mood]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mood===key)));
    img.classList.remove("changing");
  }catch(error){if(request===moodRequest){img.classList.remove("changing");$("cat-message").textContent="小宝还没准备好，过会儿再试试。"}}
}
document.querySelectorAll("[data-mood]").forEach(b=>b.onclick=()=>setMood(b.dataset.mood));
$("cat-image").addEventListener("error",()=>{if(!$("cat-image").src.endsWith("xiaobao.jpg"))setMood("original")});
