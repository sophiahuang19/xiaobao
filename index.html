<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>小宝</title>
<style>
:root{
  --ground:#E9EDF2; --ink:#2E221C; --muted:#8A7F78;
  --blue:#4A6FA5; --pink:#E3919F;
  --display:"PingFang SC","Hiragino Sans GB",sans-serif;
  --body:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --s:.72;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --ground:#0F0C0A; --ink:#F3ECE6; --muted:#A3978F; --blue:#93B4E6; --pink:#F0A6B3;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#0F0C0A; --ink:#F3ECE6; --muted:#A3978F; --blue:#93B4E6; --pink:#F0A6B3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);padding:0 16px;display:flex;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;padding-block:12px 14px}

/* 小宝 */
.photo{position:relative;flex:1 1 auto;min-height:0;border-radius:32px;overflow:hidden;background:#3A2A21;box-shadow:0 24px 50px -30px rgba(40,25,15,.7);cursor:pointer}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.photo.pat img{transform:scale(1.03)}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(to top,rgba(20,12,8,.7),rgba(20,12,8,0));pointer-events:none}
.name{position:absolute;left:22px;bottom:calc(70px * var(--s) + 14px);z-index:2;color:#fff;pointer-events:none}
.name h1{font-family:var(--display);font-weight:600;font-size:52px;line-height:1;margin:0;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.name p{margin:6px 0 0;font-size:13px;opacity:.85;letter-spacing:.04em}
.pethint{position:absolute;right:16px;bottom:calc(70px * var(--s) + 16px);z-index:2;color:#fff;font-size:12px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none;transition:opacity .4s}
.heart{position:absolute;z-index:4;pointer-events:none;color:#fff;font-size:26px;text-shadow:0 2px 8px rgba(227,145,159,.9);animation:float 1.2s ease-out forwards}
@keyframes float{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(-50%,-150px) scale(1.4) rotate(var(--r))}}
.bubble{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:3;background:#fff;color:#2E221C;font-size:14px;padding:8px 16px;border-radius:18px;white-space:nowrap;box-shadow:0 8px 20px -8px rgba(0,0,0,.35);animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}

/* 签筒 */
.draw{position:relative;z-index:5;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:calc(-70px * var(--s))}
.tube-box{width:calc(150px * var(--s));height:calc(300px * var(--s))}
.tube{position:relative;width:150px;height:300px;transform:scale(var(--s));transform-origin:0 0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.tube:focus-visible{outline:3px solid var(--blue);outline-offset:8px;border-radius:24px}
.tube .rock{position:absolute;inset:0;transform-origin:50% 90%}
.tube.shake .rock{animation:shake .14s linear infinite alternate}
@keyframes shake{from{transform:rotate(-9deg) translateX(-4px)}to{transform:rotate(9deg) translateX(4px)}}
.sticks{position:absolute;left:18px;right:18px;top:0;height:140px}
.sticks i{position:absolute;bottom:0;width:11px;height:var(--h);left:var(--x);border-radius:5px 5px 2px 2px;background:linear-gradient(90deg,#E9D8BD,#F7EBD7 45%,#DCC6A4);transform:rotate(var(--r));transform-origin:50% 100%;box-shadow:0 0 0 1px rgba(90,62,46,.12)}
.sticks i::before{content:"";position:absolute;top:0;left:0;right:0;height:18px;border-radius:5px 5px 0 0;background:#E3919F}
.tube.shake .sticks i{animation:jig .1s linear infinite alternate}
.tube.shake .sticks i:nth-child(odd){animation-duration:.13s}
.tube.shake .sticks i:nth-child(3n){animation-duration:.08s}
@keyframes jig{to{transform:rotate(var(--r)) translateY(-10px)}}
.tube-body{position:absolute;z-index:2;left:0;right:0;bottom:0;height:200px;border-radius:14px 14px 34px 34px;background:linear-gradient(90deg,#3A2A21 0%,#6B4A37 30%,#7D5842 45%,#5A3E2E 70%,#2E211A 100%);box-shadow:inset 0 10px 0 -4px rgba(0,0,0,.35),0 26px 30px -18px rgba(40,25,15,.7)}
.tube-body::before,.tube-body::after{content:"";position:absolute;left:0;right:0;height:8px;background:rgba(0,0,0,.18)}
.tube-body::before{top:34px}.tube-body::after{bottom:34px}
.tube-label{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:#F7F1EA;color:#3A2A21;writing-mode:vertical-rl;font-family:var(--display);font-size:22px;letter-spacing:.2em;padding:10px 7px;border-radius:6px;display:flex;align-items:center;gap:4px}
.tube-label svg{width:16px;height:16px;fill:#E3919F}
.drawn{position:absolute;left:50%;top:0;width:26px;height:230px;margin-left:-13px;border-radius:8px 8px 4px 4px;background:linear-gradient(90deg,#E9D8BD,#FBF1E0 45%,#DCC6A4);box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:1;display:flex;flex-direction:column;align-items:center;padding-top:34px;writing-mode:vertical-rl;font-size:15px;color:#5A3E2E;letter-spacing:.15em;font-weight:600;animation:popout .6s cubic-bezier(.2,1.4,.4,1) forwards}
.drawn::before{content:"";position:absolute;top:0;left:0;right:0;height:26px;border-radius:8px 8px 0 0;background:#E3919F}
@keyframes popout{from{transform:translateY(110px)}to{transform:translateY(-130px) rotate(4deg)}}
.drawn.fly{animation:flyaway .45s ease-in forwards}
@keyframes flyaway{from{transform:translateY(-130px) rotate(4deg)}to{transform:translateY(-110vh) rotate(-20deg);opacity:0}}
.drawn:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.hint{margin:0;font-size:14px;color:var(--muted);letter-spacing:.06em;min-height:1.5em;text-align:center}
.hint b{color:var(--pink);font-weight:500}

/* 签卡 */
.result{position:fixed;inset:0;z-index:20;background:radial-gradient(120% 80% at 50% 45%,#4A3326,#140E0A);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:fade .25s}
@keyframes fade{from{opacity:0}}
.close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:24px;line-height:42px;text-align:center}
.cardimg{display:block;max-width:min(360px,100%);max-height:calc(100% - 110px);width:auto;height:auto;border-radius:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);animation:rise .6s cubic-bezier(.2,.8,.2,1);-webkit-touch-callout:default}
@keyframes rise{from{opacity:0;transform:translateY(80px) rotate(-4deg) scale(.85)}}
.save-hint{color:#fff;opacity:.75;font-size:13px;margin:0;letter-spacing:.04em}
.again{height:46px;padding:0 28px;border-radius:23px;background:#F7F1EA;color:#3A2A21;font-size:15px;font-weight:600;letter-spacing:.06em}
.again:active{transform:scale(.95)}

@media (max-height:700px){:root{--s:.6}.name h1{font-size:42px}}
@media (max-height:600px){:root{--s:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <div class="photo" id="photo">
    <img src="xiaobao.jpg" alt="小宝：海豹色双色布偶猫，蓝眼睛，粉鼻子">
    <div class="name"><h1>小宝</h1><p>海豹色双色布偶 · 蓝眼睛</p></div>
    <div class="pethint" id="pethint">摸摸我</div>
  </div>

  <section class="draw">
    <div class="tube-box">
      <div class="tube" id="tube" role="button" tabindex="0" aria-label="按住签筒摇一摇，抽一支小宝签">
        <div class="rock">
          <div class="sticks" id="sticks"></div>
          <div class="tube-body"><span class="tube-label">小宝签<svg viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="5" ry="4.2"/><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6.5" r="2.2"/><circle cx="14" cy="6.5" r="2.2"/><circle cx="18" cy="10" r="2.2"/></svg></span></div>
        </div>
      </div>
    </div>
    <p class="hint" id="hint" aria-live="polite">按住签筒，摇一摇</p>
  </section>
</main>

<div class="result" id="result" role="dialog" aria-label="小宝签" hidden>
  <button class="close" id="close" aria-label="关闭">×</button>
  <img class="cardimg" id="cardimg" alt="">
  <p class="save-hint">长按图片，保存或发给朋友</p>
  <button class="again" id="again">再抽一支</button>
</div>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const LINES=[
"今天的计划：晒太阳，睡觉，被你摸。做完三件就是完美的一天。",
"你出门的时候我没有在等你，我只是刚好睡在门口。",
"我对你慢慢眨眼了，这在猫语里是“我信任你”。你也眨一下。",
"我的蓝眼睛里没有蓝色色素。你看到的蓝，是光的魔法。",
"我这么沉不是胖，布偶要长到四岁才算长大。大概吧。",
"被抱起来的时候我会软成一摊，这是我们布偶的招牌动作。",
"我一天要睡十四个小时，剩下的时间用来想你。和想吃的。",
"你打字的时候，键盘是全家最暖和的地方。",
"我竖着尾巴走向你，意思是：你好呀，今天也很高兴见到你。",
"我用脸蹭你，是在给你盖章：这个人类是小宝的。",
"我踩你的时候，说明我很安心。请不要动，也不要喊疼。",
"给我一个纸箱，我可以开心一整天。",
"我喵喵叫只说给你听，猫和猫之间才不这么说话。",
"我知道“小宝”是在叫我。要不要回头，看心情。",
"我胸前这圈白毛是全身最软的地方，今天允许你摸三下。",
"我不爱爬高，我更喜欢待在你脚边。",
"我背对着你睡觉，是把看不到的方向交给你了。",
"窗外有只鸟。我今天的工作很忙。",
"我把杯子推下桌子，是想确认一下重力今天还在不在。",
"我不是不理你，我只是在用耳朵听你。",
"今天也要像我一样：困了就睡，饿了就吃，想要就去蹭。",
"你回家的脚步声，我隔着门就能听出来。",
"天冷了，我的耳朵会变得更深一点。这是冬季限定款。",
"我的鼻纹全世界独一份，就像你在我心里一样。",
"呼噜呼噜是我的发动机。你一摸，它就启动。",
"我的肚子是一个陷阱，你摸之前要想清楚。",
"请多陪我玩十分钟逗猫棒，这样我就不会半夜开运动会。",
"我喝水很讲究：要流动的，要新鲜的，最好是你杯子里的。",
"我舔你有点刺，那是我舌头上的小梳子，不是嫌弃你。",
"我走路踮着脚尖，所以你永远听不到我过来。",
"你忙的时候，我就在旁边睡觉陪你。",
"我吃不出甜味，所以你的蛋糕我只是闻闻。真的只是闻闻。",
"我的胡子有多宽，我就能钻多宽的缝。今天钻进了你的被子。",
"如果我盯着空气看，别怕，我只是听见了你听不见的声音。",
"我睡着的时候爪子在动，是在梦里追东西。",
"梳毛时间到了。我的围兜需要专业护理。",
"我今天的心情：软软的，蓬蓬的，想被抱一下。",
"你看手机的时间，可以分一点给我吗？",
"我脚底是粉色的肉垫，今天允许你捏一下。",
"我小时候是一团白毛球，颜色是慢慢长出来的。你也慢慢来。",
"下雨天最适合的事：趴在窗边，听雨，打呼噜。",
"我不是黏人，我只是刚好想和你待在同一个房间。",
"请记得给我换水。这是我今天唯一的要求。之一。",
"我的尾巴甩得很快的时候，意思是“够了”，不是“好开心”。",
"早上五点叫你起床，是因为我是晨昏动物，不是故意的。",
"我把玩具叼给你，是请你一起玩的邀请函。",
"今天好好吃饭了吗？我吃了，吃了三顿。",
"我在你身边打了个哈欠，意思是这里很安全。",
"我的耳朵能转一百八十度，你说我坏话我都听得到。",
"你难过的时候，我就趴在你身上。重一点也没关系吧。",
"我不会说谢谢，但我会一直坐在你旁边。",
"被窝是我的，你的枕头也是我的，你也是我的。",
"我今天学会了一件事：只要一直看着你，零食就会出现。",
"太阳挪到哪，我就挪到哪。",
"我的毛不太打结，但你给我梳毛的时候，我还是会装作很需要。",
"我们布偶被叫作“小狗猫”，因为会跟着你走来走去。我承认。",
"你开门的时候我会去迎接你，这是布偶的礼仪。",
"今天也辛苦了。回来摸摸我，就能充电。",
"我不需要很多东西。一个你，一扇有阳光的窗，就够了。",
"我不会看时间，但我知道你几点该回家。"
];
const CN="零一二三四五六七八九";
const cnNum=n=>n<=10?(n===10?"十":CN[n]):n<20?"十"+CN[n%10]:CN[Math.floor(n/10)]+"十"+(n%10?CN[n%10]:"");
const dateKey=(d=new Date())=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
function wrapZh(ctx,text,maxW){
  const noStart="，。！？、：；）」』”…",lines=[];let line="";
  for(const ch of text){
    if(ctx.measureText(line+ch).width>maxW&&line&&!noStart.includes(ch)){lines.push(line);line=ch}else line+=ch;
  }
  if(line)lines.push(line);return lines;
}
function drawCard(idx){
  const W=1080,H=1440,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const FONT='"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif';
  x.fillStyle="#FBF8F5";x.fillRect(0,0,W,H);
  const px=110,py=110,pw=W-220,ph=740,R=pw/2,br=44,img=document.querySelector("#photo img");
  x.save();x.beginPath();x.moveTo(px,py+R);x.arc(px+R,py+R,R,Math.PI,0);x.lineTo(px+pw,py+ph-br);
  x.quadraticCurveTo(px+pw,py+ph,px+pw-br,py+ph);x.lineTo(px+br,py+ph);x.quadraticCurveTo(px,py+ph,px,py+ph-br);x.closePath();x.clip();
  const s=Math.max(pw/img.naturalWidth,ph/img.naturalHeight),iw=img.naturalWidth*s,ih=img.naturalHeight*s;
  x.drawImage(img,px+(pw-iw)/2,py+(ph-ih)*0.28,iw,ih);x.restore();
  // stick-number badge on the photo
  const label=`第${cnNum(idx+1)}签`;x.font=`600 34px ${FONT}`;const tw=x.measureText(label).width+56;
  x.fillStyle="#E3919F";x.beginPath();x.roundRect?x.roundRect(W/2-tw/2,py+ph-34,tw,68,34):x.rect(W/2-tw/2,py+ph-34,tw,68);x.fill();
  x.fillStyle="#fff";x.textAlign="center";x.fillText(label,W/2,py+ph+12);
  const d=new Date();x.fillStyle="#9A8F88";x.font=`500 32px ${FONT}`;
  x.fillText(`${d.getMonth()+1}月${d.getDate()}日 · 星期${"日一二三四五六"[d.getDay()]}`,W/2,py+ph+96);
  x.fillStyle="#2E221C";x.font=`600 58px ${FONT}`;
  const lines=wrapZh(x,LINES[idx],W-260),lh=88,top=py+ph+136+(3-lines.length)*lh/2;
  lines.forEach((l,i)=>x.fillText(l,W/2,top+lh*(i+0.75)));
  x.font=`500 38px ${FONT}`;x.fillStyle="#6E625B";x.fillText("—— 小宝",W/2-26,H-150);
  const cx=W/2+110,cy=H-164;x.fillStyle="#E3919F";
  x.beginPath();x.ellipse(cx,cy+8,16,13,0,0,7);x.fill();
  [[-17,-8],[-7,-20],[7,-20],[17,-8]].forEach(([a,b])=>{x.beginPath();x.arc(cx+a,cy+b,6.5,0,7);x.fill()});
  x.font=`400 26px ${FONT}`;x.fillStyle="#B4AAA3";x.fillText("sophiahuang19.github.io/xiaobao",W/2,H-70);
  return c.toDataURL("image/jpeg",.9);
}
/* wooden clack sound */
let ac=null;
function clack(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime,len=.05,buf=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);
    const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    f.type="bandpass";f.frequency.value=1400+Math.random()*1400;f.Q.value=4;g.gain.value=.5;
    src.buffer=buf;src.connect(f).connect(g).connect(ac.destination);src.start(t);
  }catch(e){}
}
/* pet 小宝 */
const petLines=["呼噜呼噜～","（眯起眼睛）","再摸一下嘛","（翻了个身）","（慢慢眨眼）","（开始踩奶）","喵～","（用头顶你的手）"];
let pats=0,bt;
$("photo").addEventListener("click",e=>{
  const r=$("photo").getBoundingClientRect();
  for(let k=0;k<3;k++){const h=document.createElement("span");h.className="heart";h.textContent="♥";
    h.style.left=(e.clientX-r.left+(k-1)*18)+"px";h.style.top=(e.clientY-r.top)+"px";h.style.setProperty("--r",(k-1)*18+"deg");
    h.style.animationDelay=k*70+"ms";$("photo").appendChild(h);setTimeout(()=>h.remove(),1400)}
  $("photo").classList.add("pat");setTimeout(()=>$("photo").classList.remove("pat"),180);
  $("pethint").style.opacity=0;
  pats++;
  if(pats%3===1){document.querySelector(".bubble")?.remove();const b=document.createElement("div");b.className="bubble";
    b.textContent=petLines[Math.floor(pats/3)%petLines.length];$("photo").appendChild(b);clearTimeout(bt);bt=setTimeout(()=>b.remove(),1600)}
});

/* 签筒 */
[[4,118,-7],[16,132,-3],[28,112,2],[40,138,-1],[52,120,5],[64,130,1],[76,114,7],[88,126,3],[34,100,-5],[70,104,6]]
  .forEach(([xp,h,r])=>{const i=document.createElement("i");i.style.cssText=`--x:${xp}%;--h:${h}px;--r:${r}deg`;$("sticks").appendChild(i)});

const NEED=1200;let shaken=0,holding=false,done=false,last=0,raf=0,picked=0;
function tick(now){
  const dt=Math.min(now-last,50);last=now;
  if(holding&&!done){
    shaken+=dt;if(Math.random()<.35)clack();
    $("hint").textContent=shaken<NEED/2?"摇呀摇……":"快出来了！";
    if(shaken>=NEED){dropStick();return}
    raf=requestAnimationFrame(tick);
  }
}
function startShake(){if(done)return;holding=true;$("tube").classList.add("shake");last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function stopShake(){holding=false;$("tube").classList.remove("shake")}
$("tube").addEventListener("pointerdown",e=>{if(done)return;e.preventDefault();startShake()});
["pointerup","pointercancel","pointerleave"].forEach(ev=>$("tube").addEventListener(ev,stopShake));
$("tube").addEventListener("contextmenu",e=>e.preventDefault());
$("tube").addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!e.repeat){e.preventDefault();startShake()}});
$("tube").addEventListener("keyup",stopShake);

function pick(){
  const drawn=new Set(store.get("xb-drawn",[]));
  let pool=LINES.map((_,i)=>i).filter(i=>!drawn.has(i));
  if(!pool.length){drawn.clear();pool=LINES.map((_,i)=>i)}
  const i=pool[Math.floor(Math.random()*pool.length)];drawn.add(i);store.set("xb-drawn",[...drawn]);return i;
}
function dropStick(){
  done=true;stopShake();clack();setTimeout(clack,90);
  picked=pick();
  const s=document.createElement("button");s.className="drawn";s.id="drawn";s.textContent=`第${cnNum(picked+1)}签`;
  s.setAttribute("aria-label",`第${picked+1}签，点一下看看`);
  s.addEventListener("pointerdown",e=>e.stopPropagation());
  s.onclick=()=>{s.classList.add("fly");setTimeout(showResult,380)};
  $("tube").appendChild(s);
  $("hint").innerHTML="掉出来一支！<b>点这支签</b>";
  setTimeout(()=>s.focus({preventScroll:true}),600);
}
function showResult(){
  const img=document.querySelector("#photo img"),go=()=>{
    $("cardimg").src=drawCard(picked);$("cardimg").alt=`第${picked+1}签：${LINES[picked]}`;$("result").hidden=false;$("again").focus({preventScroll:true});
  };
  img.complete&&img.naturalWidth?go():img.addEventListener("load",go,{once:true});
}
function reset(){done=false;shaken=0;$("drawn")?.remove();$("hint").textContent="按住签筒，摇一摇";$("result").hidden=true}
$("again").onclick=()=>{reset();$("tube").focus({preventScroll:true})};
$("close").onclick=reset;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("result").hidden)reset()});
</script>
