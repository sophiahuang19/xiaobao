function wrapZh(ctx,text,maxW){

}
function drawCard(idx,img){
  const W=1080,H=1440,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const FONT='"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif';
  x.fillStyle="#FBF8F5";x.fillRect(0,0,W,H);
  const px=110,py=110,pw=W-220,ph=740,R=pw/2,br=44;
  x.save();x.beginPath();x.moveTo(px,py+R);x.arc(px+R,py+R,R,Math.PI,0);x.lineTo(px+pw,py+ph-br);
  x.quadraticCurveTo(px+pw,py+ph,px+pw-br,py+ph);x.lineTo(px+br,py+ph);x.quadraticCurveTo(px,py+ph,px,py+ph-br);x.closePath();x.clip();
  const s=Math.max(pw/img.naturalWidth,ph/img.naturalHeight),iw=img.naturalWidth*s,ih=img.naturalHeight*s;
  x.drawImage(img,px+(pw-iw)/2,py+(ph-ih)*0.28,iw,ih);x.restore();
  // stick-number badge on the photo
  const label=`第${cnNum(idx+1)}签`;x.font=`600 34px ${FONT}`;const tw=x.measureText(label).width+56;
  x.fillStyle="#E3919F";x.beginPath();x.roundRect?x.roundRect(W/2-tw/2,py+ph-34,tw,68,34):x.rect(W/2-tw/2,py+ph-34,tw,68);x.fill();
  x.fillStyle="#fff";x.textAlign="center";x.fillText(label,W/2,py+ph+12);
  const d=new Date();x.fillStyle="#9A8F88";x.font=`500 32px ${FONT}`;
  x.fillText(`${d.getMonth()+1}月${d.getDate()}日 · 星期${"日一二三四五六"[d.getDay()]}`,W/2,py+ph+96);
  x.fillStyle="#2E221C";x.font=`600 58px ${FONT}`;
  const lines=wrapZh(x,LINES[idx],W-260),lh=88,top=py+ph+136+(3-lines.length)*lh/2;
  lines.forEach((l,i)=>x.fillText(l,W/2,top+lh*(i+0.75)));
  x.font=`500 38px ${FONT}`;x.fillStyle="#6E625B";x.fillText("—— 小宝",W/2-26,H-150);
  const cx=W/2+110,cy=H-164;x.fillStyle="#E3919F";
  x.beginPath();x.ellipse(cx,cy+8,16,13,0,0,7);x.fill();
  [[-17,-8],[-7,-20],[7,-20],[17,-8]].forEach(([a,b])=>{x.beginPath();x.arc(cx+a,cy+b,6.5,0,7);x.fill()});
  x.font=`400 26px ${FONT}`;x.fillStyle="#B4AAA3";x.fillText("sophiahuang19.github.io/xiaobao",W/2,H-70);
  return c.toDataURL("image/jpeg",.9);
}
/* wooden clack sound */
let ac=null,soundOn=false;
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").setAttribute("aria-pressed",String(soundOn));$("sound").setAttribute("aria-label",soundOn?"关闭音效":"开启音效");$("sound").textContent=`音效 · ${soundOn?"开":"关"}`;if(soundOn)clack()};
function clack(){
  if(!soundOn)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime,len=.05,buf=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);
    const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    f.type="bandpass";f.frequency.value=1400+Math.random()*1400;f.Q.value=4;g.gain.value=.5;
    src.buffer=buf;src.connect(f).connect(g).connect(ac.destination);src.start(t);
  }catch(e){}
}
/* The portrait is a small living scene, rather than a mood selector. */
let pats=0,bt,idleTimer,playTimer,lastPet=-Infinity;
let done=false,picked=0,cardMood="happy",lastCardMood=store.get("xb-last-card-mood",null);
const reduced=matchMedia("(prefers-reduced-motion: reduce)");
function say(text){
  $("cat-message").textContent=text;
  document.querySelector(".bubble")?.remove();
  const b=document.createElement("span");b.className="bubble";b.textContent=text;$("photo").appendChild(b);
  clearTimeout(bt);bt=setTimeout(()=>b.remove(),2400);
}
function restLater(){clearTimeout(idleTimer);idleTimer=setTimeout(async()=>{
  if(document.hidden||$("result").open)return;
  await setMood("sleepy");say("你忙你的，我先眯一小会儿。");
},22000)}
function offerNote(){
  if(done)return;done=true;picked=pick();
  const pool=Object.keys(moods).filter(key=>key!==lastCardMood);
  cardMood=pool[Math.floor(Math.random()*pool.length)];
  clack();$("secret-note").hidden=false;
  $("draw-button").textContent="接住小宝的悄悄话 ↗";
  $("hint").textContent="它把一张纸条压在爪爪下面。";
}
function traces(x,y,symbol="♡"){
  if(reduced.matches)return;
  for(let k=0;k<3;k++){const h=document.createElement("span");h.className="heart";h.textContent=symbol;
    h.style.left=(x+(k-1)*20)+"px";h.style.top=y+"px";h.style.setProperty("--r",(k-1)*16+"deg");
    h.style.animationDelay=k*90+"ms";$("photo").appendChild(h);setTimeout(()=>h.remove(),1300)}
}
async function pet(e){
  const now=performance.now();if(now-lastPet<300)return;lastPet=now;clearTimeout(playTimer);
  const r=$("photo").getBoundingClientRect(),x=e.detail?e.clientX-r.left:r.width/2,y=e.detail?e.clientY-r.top:r.height/3;
  const paw=y>r.height*.62;const sleepy=currentMood==="sleepy";
  pats++;await setMood(paw?"curious":"happy");
  traces(x,y,paw?"✧":"♡");$("photo").classList.add("pat");setTimeout(()=>$("photo").classList.remove("pat"),250);
  const replies=paw?["抓到你了，这只手归我。","肉垫只给你捏一下。","你碰了我的小开关。"]:["呼噜呼噜……发动机启动。","再往左一点，对，就是那里。","已盖章：这是我的人类。"];
  say(sleepy?"嗯？是你呀，那再陪你一会儿。":replies[(pats-1)%replies.length]);
  $("together").textContent=pats<3?"它好像又靠近了你一点。":"今天的小宝，已经被你哄好了。";
  if(pats===3){offerNote();say("等一下，爪爪下面有东西给你。");}
  if(pats%7===0){say("阿嚏！……刚才不算，重新可爱。");$("photo").classList.add("sneeze");setTimeout(()=>$("photo").classList.remove("sneeze"),450)}
  restLater();
}
$("photo").addEventListener("click",pet);
$("photo").addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse"||reduced.matches)return;
  const r=$("photo").getBoundingClientRect();$("cat-image").style.translate=`${(e.clientX-r.left-r.width/2)*.012}px ${(e.clientY-r.top-r.height/2)*.012}px`;
});
$("photo").addEventListener("pointerleave",()=>$("cat-image").style.translate="0 0");
$("play").onclick=async()=>{
  clearTimeout(playTimer);clearTimeout(idleTimer);await setMood("curious");say("别动，我看到那根羽毛了。");
  document.querySelector(".feather")?.remove();const f=document.createElement("span");f.className="feather";f.textContent="🪶";f.setAttribute("aria-hidden","true");$("photo").appendChild(f);
  setTimeout(()=>f.remove(),1700);
  playTimer=setTimeout(async()=>{await setMood("happy");say("抓到了！奖励你摸一下。");restLater()},1600);
};
$("original").onclick=async()=>{clearTimeout(playTimer);clearTimeout(idleTimer);await setMood(currentMood==="original"?"happy":"original");restLater()};
$("secret-note").onclick=showResult;
function pick(){
  const drawn=new Set(store.get("xb-drawn",[]));
  let pool=LINES.map((_,i)=>i).filter(i=>!drawn.has(i));
  if(!pool.length){drawn.clear();pool=LINES.map((_,i)=>i)}
  const i=pool[Math.floor(Math.random()*pool.length)];drawn.add(i);store.set("xb-drawn",[...drawn]);return i;
}
let resultBusy=false;
async function showResult(){
  if(resultBusy)return;resultBusy=true;
  try{
    const img=new Image();img.src=moods[cardMood].src;await img.decode();
    const data=drawCard(picked,img);
    lastCardMood=cardMood;store.set("xb-last-card-mood",cardMood);$("cardimg").src=data;$("download").href=data;
    $("cardimg").alt=`${moods[cardMood].alt}。第${picked+1}签：${LINES[picked]}`;
    if(!$("result").open)$("result").showModal();
  }catch(error){$("hint").textContent="图片还没准备好，再点一次试试。"}
  finally{resultBusy=false}
}
function reset(){done=false;$("secret-note").hidden=true;$("draw-button").textContent="小宝，再说一句悄悄话 ↗";$("hint").textContent="小好运已经装进口袋了。";restLater()}
$("draw-button").onclick=()=>{clearTimeout(idleTimer);offerNote();showResult()};
let drawAgain=false;
$("again").onclick=()=>{drawAgain=true;$("result").close()};
$("close").onclick=()=>$("result").close();
$("result").addEventListener("close",()=>{reset();$("draw-button").focus();if(drawAgain){drawAgain=false;$("draw-button").click()}});
document.addEventListener("visibilitychange",()=>{if(document.hidden){clearTimeout(idleTimer);clearTimeout(playTimer)}else restLater()});
const moods={
  happy:{src:"assets/happy.jpg",tag:"想和你贴贴",message:"“今天也想被你摸摸。”",alt:"小宝伸出毛茸茸的爪子，想和你贴贴"},
  curious:{src:"assets/curious.jpg",tag:"发现一点新鲜事",message:"“那是什么？让我看看。”",alt:"小宝歪着脑袋，蓝眼睛好奇地望着羽毛"},
  sleepy:{src:"assets/sleepy.jpg",tag:"进入省电模式",message:"“你忙你的，我睡在你旁边。”",alt:"小宝蜷在柔软的沙发上，闭眼睡觉"},
  original:{src:"xiaobao.jpg",tag:"是小宝本宝",message:"“没错，就是这么漂亮。”",alt:"小宝本尊：海豹色双色布偶猫，蓝眼睛，粉鼻子"}
};
let currentMood="happy",moodRequest=0;
async function setMood(key){
  const request=++moodRequest,m=moods[key],img=$("cat-image");
  try{const next=new Image();next.src=m.src;await next.decode();if(request!==moodRequest)return;
    img.classList.add("changing");await new Promise(r=>setTimeout(r,140));if(request!==moodRequest)return;
    img.src=m.src;img.alt=m.alt;currentMood=key;
    $("mood-tag").textContent=m.tag;$("cat-message").textContent=m.message;
    $("photo-note").textContent=key==="original"?"小宝的真实照片":"小宝的想象日常 · AI 生成";
    $("original").setAttribute("aria-pressed",String(key==="original"));
    img.classList.remove("changing");
  }catch(error){if(request===moodRequest){img.classList.remove("changing");$("cat-message").textContent="小宝还没准备好，过会儿再试试。"}}
}
restLater();
$("cat-image").addEventListener("error",()=>{if(!$("cat-image").src.endsWith("xiaobao.jpg"))setMood("original")});
</script>
